plugins { id 'com.android.application' }

dependencies {
    implementation 'org.unifiedpush.android:connector:3.3.5'
}

android {
    namespace 'dev.dumbtalk.android'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.dumbtalk.android'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
